name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: make test

  # Live channel scrapes can fail from GitHub-hosted runners (e.g. overseas IP
  # blocks). Keep the results visible without blocking merge.
  scrape:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run live scrape tests
        id: scrape
        run: |
          set -o pipefail
          make test-scrape 2>&1 | tee scrape-output.txt

      - name: Upsert sticky PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          MARKER='<!-- scrape-ci-sticky -->'
          REPO='${{ github.repository }}'
          PR='${{ github.event.pull_request.number }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          if [ "$SCRAPE_OUTCOME" = "success" ]; then
            HEADER='## Live scrape results: passed'
          else
            HEADER='## Live scrape results: failed'
          fi

          if [ -f scrape-output.txt ]; then
            if grep -q 'short test summary info' scrape-output.txt; then
              SUMMARY=$(sed -n '/short test summary info/,$p' scrape-output.txt | sed '/^make:/,$d')
            else
              SUMMARY=$(grep -E '^=+ .*(passed|failed|error|skipped).* =+$' scrape-output.txt | tail -n1)
            fi
            if [ -z "$SUMMARY" ]; then
              SUMMARY='_No pytest summary found._'
            fi
          else
            SUMMARY='_No scrape output captured._'
          fi

          {
            echo "$MARKER"
            echo "$HEADER"
            echo
            echo "TV Asahi (\`joex-dtv\`) is known to return \`406 Not Acceptable\` in CI. If it fails here, confirm with \`make test-scrape\` locally before treating it as a real regression."
            echo
            echo "[Workflow run]($RUN_URL)"
            echo
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } > scrape-comment.md

          COMMENT_ID=$(
            gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${MARKER}\")) | .id" \
              | head -n1
          )

          if [ -n "$COMMENT_ID" ]; then
            jq -n --rawfile body scrape-comment.md '{body: $body}' \
              | gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" --input -
          else
            jq -n --rawfile body scrape-comment.md '{body: $body}' \
              | gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input -
          fi

  test-container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name test-container -p 8000:80 ${{ env.IMAGE_NAME }}:test

      - name: Wait for container to be ready
        run: |
          timeout 30 sh -c 'until docker logs test-container 2>&1 | grep -q "Application startup complete"; do sleep 1; done'

      - name: Test API endpoint
        run: |
          # Test root path
          root_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          if [ "$root_response" != "200" ]; then
            echo "Root path test failed with status code: $root_response"
            docker logs test-container
            exit 1
          fi
          echo "Root path test passed"
          
          # Test RSS feed endpoint
          rss_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/joak-dtv)
          if [ "$rss_response" != "200" ]; then
            echo "RSS feed test failed with status code: $rss_response"
            docker logs test-container
            exit 1
          fi
          echo "RSS feed test passed"

      - name: Show container logs on failure
        if: failure()
        run: docker logs test-container

      - name: Stop container
        if: always()
        run: docker stop test-container

  build-and-push:
    needs: test-container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
