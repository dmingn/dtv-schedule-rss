name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: make test

  # Live channel scrapes can fail from GitHub-hosted runners (e.g. overseas IP
  # blocks). Keep the results visible without blocking merge.
  scrape:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run live scrape tests
        id: scrape
        run: |
          set -o pipefail
          make test-scrape 2>&1 | tee scrape-output.txt

      - name: Upsert sticky PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          MARKER='<!-- scrape-ci-sticky -->'
          REPO='${{ github.repository }}'
          PR='${{ github.event.pull_request.number }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          if [ "$SCRAPE_OUTCOME" = "success" ]; then
            HEADER='## Live scrape results: passed'
          else
            HEADER='## Live scrape results: failed'
          fi

          if [ -f scrape-output.txt ]; then
            if grep -q 'short test summary info' scrape-output.txt; then
              SUMMARY=$(sed -n '/short test summary info/,$p' scrape-output.txt | sed '/^make:/,$d')
            else
              SUMMARY=$(grep -E '^=+ .*(passed|failed|error|skipped).* =+$' scrape-output.txt | tail -n1)
            fi
            if [ -z "$SUMMARY" ]; then
              SUMMARY='_No pytest summary found._'
            fi
          else
            SUMMARY='_No scrape output captured._'
          fi

          {
            echo "$MARKER"
            echo "$HEADER"
            echo
            echo "[Workflow run]($RUN_URL)"
            echo
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } > scrape-comment.md

          COMMENT_ID=$(
            gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${MARKER}\")) | .id" \
              | head -n1
          )

          if [ -n "$COMMENT_ID" ]; then
            jq -n --rawfile body scrape-comment.md '{body: $body}' \
              | gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" --input -
          else
            jq -n --rawfile body scrape-comment.md '{body: $body}' \
              | gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input -
          fi

  test-container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name test-container -p 8000:80 ${{ env.IMAGE_NAME }}:test

      - name: Wait for container to be ready
        run: |
          timeout 30 sh -c 'until docker logs test-container 2>&1 | grep -q "Application startup complete"; do sleep 1; done'

      - name: Test API endpoint
        run: |
          # Test root path
          root_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          if [ "$root_response" != "200" ]; then
            echo "Root path test failed with status code: $root_response"
            docker logs test-container
            exit 1
          fi
          echo "Root path test passed"
          
          # Test RSS feed endpoint
          rss_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/joak-dtv)
          if [ "$rss_response" != "200" ]; then
            echo "RSS feed test failed with status code: $rss_response"
            docker logs test-container
            exit 1
          fi
          echo "RSS feed test passed"

      - name: Show container logs on failure
        if: failure()
        run: docker logs test-container

      - name: Stop container
        if: always()
        run: docker stop test-container

  build-and-push:
    needs: test-container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
