[project]
name = "dtv-schedule-rss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "async-lru>=2.3.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.40.0",
    "httpx[http2]>=0.28.1",
    "tenacity>=9.1.4",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "types-cachetools>=6.2.0.20251022",
    "types-requests>=2.33.0.20260518",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
